<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Instantboard">
  <!-- Stacked kanban columns: purple (front), blue, red (back). Horizontal offset only. -->
  <g fill-rule="evenodd">
    <!-- back: red -->
    <rect x="56" y="24" width="40" height="80" rx="8" ry="8" fill="#F07167" stroke="#FFFFFF" stroke-width="3"/>
    <!-- middle: blue -->
    <rect x="44" y="24" width="40" height="80" rx="8" ry="8" fill="#3267D4" stroke="#FFFFFF" stroke-width="3"/>
    <!-- front: purple -->
    <rect x="32" y="24" width="40" height="80" rx="8" ry="8" fill="#B368EC" stroke="#FFFFFF" stroke-width="3"/>
  </g>
</svg>
